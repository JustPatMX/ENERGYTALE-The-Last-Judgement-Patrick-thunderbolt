name: Construir juego para Windows

on:
  workflow_dispatch:        # botón "Run workflow" en la pestaña Actions
  push:
    tags: ['v*']            # al crear una etiqueta como v0.9.0 también publica un Release

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar la fuente VT323
        shell: bash
        run: |
          mkdir -p game/fonts
          curl -fL -o game/fonts/VT323-Regular.ttf https://github.com/google/fonts/raw/main/ofl/vt323/VT323-Regular.ttf
          curl -fL -o game/fonts/OFL.txt https://github.com/google/fonts/raw/main/ofl/vt323/OFL.txt

      - name: Instalar dependencias
        run: npm install

      - name: Construir (.exe instalador + .zip portable)
        run: npm run dist

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: PatrickThunderbolt-Windows
          path: |
            dist/*.exe
            dist/*.zip

      - name: Publicar Release (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
